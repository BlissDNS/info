-- dnsdist front end for AdGuard Home. Plain DNS on 53 only.
-- AdGuard Home keeps DoH (443), DoT (853/tcp) and DoQ (853/udp) itself.

-- AdGuard Home's plain DNS listener, moved off 53. Firewall this port from outside.
newServer({address="127.0.0.1:5300", name="adguard"})

setLocal("0.0.0.0:53")
addLocal("[::]:53")

-- dnsdist only answers private ranges by default. A public resolver has to open this up.
setACL({"0.0.0.0/0", "::/0"})

-- Blocklist, regenerated by update-blocklist.sh
blocked = newNMG()
local f = io.open("/etc/dnsdist/blocked.txt", "r")
if f then
  for line in f:lines() do
    line = line:gsub("%s+", "")
    if line ~= "" and line:sub(1, 1) ~= "#" then
      blocked:addMask(line)
    end
  end
  f:close()
else
  warnlog("/etc/dnsdist/blocked.txt not found, starting with an empty blocklist")
end
addAction(NetmaskGroupRule(blocked), DropAction())

-- ANY has no legitimate use on a public resolver
addAction(QTypeRule(DNSQType.ANY), DropAction())

-- Big-answer types over UDP always get TC, real clients retry over TCP
addAction(AndRule({OrRule({QTypeRule(DNSQType.TXT), QTypeRule(DNSQType.DNSKEY)}), TCPRule(false)}), TCAction())

-- Over 20 qps per IP on UDP gets TC instead of dropped, so NAT users still resolve
addAction(AndRule({MaxQPSIPRule(20, 32, 64, 100), TCPRule(false)}), TCAction())

-- Hard ceiling on TCP, kept well above the UDP limit
addAction(MaxQPSIPRule(100, 32, 64, 200), DropAction())
