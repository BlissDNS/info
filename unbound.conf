server:
  # ---- Network ----
  # Localhost only, AdGuard Home is the only client
  interface: 127.0.0.1
  port: 5335
  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes
  edns-buffer-size: 1232
  # Needs net.core.rmem_max >= 1048576 or the kernel ignores it
  so-rcvbuf: 1m

  # ---- Performance ----
  # Match num-threads to your CPU cores. Slabs only matter above 1 thread.
  num-threads: 1
  msg-cache-slabs: 8
  rrset-cache-slabs: 8
  infra-cache-slabs: 8
  key-cache-slabs: 8

  # ---- Privacy ----
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes

  # ---- Security and DNSSEC ----
  # DNSSEC trust anchor comes from root-auto-trust-anchor-file.conf (Debian/Ubuntu package).
  # Test: dig @127.0.0.1 -p 5335 dnssec-failed.org should return SERVFAIL.
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-referral-path: yes
  harden-algo-downgrade: no
  aggressive-nsec: yes
  # 0x20 case randomization breaks some authoritative servers
  use-caps-for-id: no
  # Flush the cache if this many unexpected replies arrive (poisoning defense)
  unwanted-reply-threshold: 10000

  # ---- Cache ----
  rrset-cache-size: 256m
  msg-cache-size: 128m
  cache-min-ttl: 60
  cache-max-ttl: 14400
  prefetch: yes
  prefetch-key: yes
  target-fetch-policy: "3 2 1 1 1"
  rrset-roundrobin: yes
  # Serve expired records for up to an hour, only if a fresh lookup takes over 1.8s
  serve-expired: yes
  serve-expired-ttl: 3600
  serve-expired-client-timeout: 1800

  # ---- Rebinding protection ----
  # Strip private addresses from public answers.
  # Loopback is included, so services that resolve to 127.0.0.1 on purpose won't work.
  private-address: 0.0.0.0/8
  private-address: 10.0.0.0/8
  private-address: 100.64.0.0/10
  private-address: 127.0.0.0/8
  private-address: 169.254.0.0/16
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: ::1/128
  private-address: ::ffff:0:0/96
  private-address: fc00::/7
  private-address: fe80::/10
