# Listen on localhost only, AdGuard Home is the only client
local-address=127.0.0.1
local-port=5354
allow-from=127.0.0.0/8

# Outgoing queries over IPv4 only, same as do-ip6: no
query-local-address=0.0.0.0

# Set number of threads to use
threads=1

# Hide DNS server info
server-id=disabled
version-string=none

# DNSSEC, root trust anchor is built in, no key file needed
dnssec=validate
qname-minimization=yes
aggressive-nsec-cache-size=100000

# Cache lifetime, same as cache-min-ttl and cache-max-ttl
minimum-ttl-override=300
max-cache-ttl=14400

# Serve expired records for up to an hour if refresh fails (120 x 30 seconds)
serve-stale-extensions=120

# Refresh popular records before they expire, same idea as prefetch
refresh-on-ttl-perc=10

# EDNS buffer size
edns-outgoing-bufsize=1232
udp-truncation-threshold=1232

# Strip private addresses from answers, same as private-address
lua-dns-script=/etc/powerdns/rebind.lua
